name: alloguinaar
description: "Commandez vos poulets frais depuis les fermes locales - Allo Guinaar"
publish_to: 'none'

version: 1.1.1+91

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.1
  webview_flutter: ^4.13.1
  # ── Ajoutés depuis apiag-beta (notifications, espace livreur) ──
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # ── Ajouté pour le parrainage (partage natif du lien d'invitation,
  #    reprend le comportement navigator.share() du web) ──
  share_plus: ^10.1.2
  # ── Ajoutés pour la messagerie vocale (Lot 5) ──
  # record 7+ exige Dart SDK >=3.12.0 (confirmé indisponible chez vous,
  # SDK actuel 3.11.3). record 5.x traîne le conflit record_linux /
  # record_platform_interface. record 6.1.1 est la version où ce
  # conflit précis a été corrigé par l'auteur (confirmé par un
  # développeur ayant eu exactement la même erreur), sans exiger un
  # SDK plus récent.
  record: ^6.1.1
  # ── Ajouté pour les formations vidéo (Lot 9) ──
  video_player: ^2.9.2
  audioplayers: ^6.1.0
  # ── Ajoutés pour le Lot 11 (Marketing & Social) ──
  app_links: ^6.4.1
  # 🆕 Version choisie pour rester compatible avec firebase_core déjà
  # fixé à 3.15.2 dans ce projet (les paquets Firebase récents (12.x)
  # exigent firebase_core 4.x — piège de version déjà rencontré avec
  # d'autres paquets, évité ici en restant sur la même génération).
  firebase_analytics: ^11.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1   # ← AJOUTÉ pour l'icône

# ─── Configuration de l'icône ────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_launcher.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#8B0000"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

# ─── Flutter ─────────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png               # ← icône de l'app
    - assets/sounds/alarme_commande.mp3   # 🆕 sonnerie de proposition de commande

