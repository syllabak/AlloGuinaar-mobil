workflows:
  # ═══════════════════════════════════════════════════════════
  #  ANDROID — Google Play (build AAB + APK)
  # ═══════════════════════════════════════════════════════════
  android-release:
    name: Allo Guinaar - Android Play Store
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - alloguinaar
    scripts:
      - name: Install Flutter dependencies
        script: flutter packages pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      # 🆕 Fichier Firebase — reconstitué à partir d'une variable
      # d'environnement chiffrée (voir GUIDE_CODEMAGIC.md, section
      # "Variables à créer" : GOOGLE_SERVICES_JSON, encodée en base64).
      - name: Restaurer google-services.json
        script: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ ERREUR : la variable d'environnement GOOGLE_SERVICES_JSON est vide ou non définie."
            echo "   → Codemagic : App settings > Environment variables > groupe 'alloguinaar'"
            echo "   → Valeur attendue : le contenu de android/app/google-services.json encodé en base64"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          if ! python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "❌ ERREUR : google-services.json généré n'est pas un JSON valide après décodage."
            echo "   → La variable GOOGLE_SERVICES_JSON ne contient probablement pas du base64 valide"
            echo "     (vérifiez que vous avez bien encodé le fichier, pas collé son contenu brut)."
            echo "   Contenu obtenu (100 premiers caractères) :"
            head -c 100 android/app/google-services.json
            exit 1
          fi
          echo "✅ google-services.json restauré et valide"

      # 🆕 Keystore de signature — reconstitué à partir de variables
      # d'environnement chiffrées (voir GUIDE_CODEMAGIC.md).
      - name: Restaurer le keystore de signature
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          cat > android/key.properties << EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/keystore.jks
          EOF

      - name: Flutter analyze
        script: flutter analyze
        ignore_failure: true

      - name: Build APK + App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.1.2 \
            --build-number=$BUILD_NUMBER
          flutter build apk --release \
            --build-name=1.1.2 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      # 🆕 Publication automatique sur Google Play — nécessite la
      # variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (voir
      # GUIDE_CODEMAGIC.md). Piste "internal" par défaut (test interne),
      # à changer vous-même une fois prêt pour la production.
      # 🆕 Publication Play Store désactivée temporairement : la
      # variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS n'est pas encore
      # configurée (ou invalide), ce qui faisait échouer TOUT le build
      # avant même de compiler. L'APK/AAB reste téléchargeable en
      # artefact ci-dessous. Pour réactiver : suivez
      # GUIDE_GOOGLE_PLAY_API.md, puis décommentez ce bloc.
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true
      email:
        recipients:
          - bakarysylla58@gmail.com

  # ═══════════════════════════════════════════════════════════
  #  iOS — App Store Connect (TestFlight)
  # ═══════════════════════════════════════════════════════════
  ios-release:
    name: Allo Guinaar - iOS App Store
    max_build_duration: 60
    # 🆕 CORRIGÉ — "integrations:" doit être une clé au même niveau que
    # "environment:" (sœur, pas enfant) : Codemagic a rejeté le yaml
    # précédent avec "extra fields not permitted" parce que je l'avais
    # imbriquée par erreur À L'INTÉRIEUR de "environment:". Structure
    # correcte ci-dessous.
    integrations:
      app_store_connect: Codemagic Signing v2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - alloguinaar
      vars:
        BUNDLE_ID: "sn.danov.alloguinaar"
    scripts:
      # 🆕 CORRIGÉ — ces quatre étapes remplacent "Set up code signing
      # identities" (bloc auto simple) ET l'ancienne étape manuelle
      # "Set up code signing" qui appelait fetch-signing-files avec une
      # mauvaise clé et retrouvait systématiquement un certificat
      # révoqué. Ici, une seule source de vérité : l'intégration nommée
      # ci-dessus, aucun appel réseau redondant qui pourrait entrer en
      # conflit avec elle.
      - name: Set up keychain to be used for code signing
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up signing certificate
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Install Flutter dependencies
        script: flutter packages pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      # 🆕 Fichier Firebase iOS — reconstitué à partir d'une variable
      # d'environnement chiffrée (voir GUIDE_CODEMAGIC.md).
      - name: Restaurer GoogleService-Info.plist
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "❌ ERREUR : la variable d'environnement GOOGLE_SERVICE_INFO_PLIST est vide ou non définie."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          if ! plutil -lint ios/Runner/GoogleService-Info.plist > /dev/null 2>&1; then
            echo "❌ ERREUR : GoogleService-Info.plist généré n'est pas valide après décodage."
            echo "   → Vérifiez que GOOGLE_SERVICE_INFO_PLIST contient bien le fichier encodé en base64."
            exit 1
          fi
          echo "✅ GoogleService-Info.plist restauré et valide"

      - name: Flutter analyze
        script: flutter analyze
        ignore_failure: true

      - name: Build IPA for App Store
        script: |
          flutter build ipa --release \
            --build-name=1.1.2 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa

    # 🆕 CORRIGÉ — remplace l'étape manuelle "app-store-connect publish"
    # (qui nécessitait le contournement --use-old-altool pour un bug
    # d'altool sous Xcode 26.2+) par le mécanisme de publication intégré
    # de Codemagic, qui n'utilise pas altool et n'est donc pas concerné
    # par ce bug. "submit_to_app_store" n'est PAS activé : ça enverrait
    # directement en revue App Store à chaque build, une décision qui
    # doit rester volontaire, pas automatique à chaque test.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - bakarysylla58@gmail.com